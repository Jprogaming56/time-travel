plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = 'com.personal.timetravel'
version = project.mod_version
base { archivesName = 'time-travel' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { timetravel { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'timetravel.refmap.json'
    config 'timetravel.mixins.json'
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // AIT + whatever it needs to resolve types (AIT's remapped.jar, AmbleKit, ...). See README.
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}

tasks.named('jar') {
    manifest { attributes 'MixinConfigs': 'timetravel.mixins.json' }
    finalizedBy 'reobfJar'
}
